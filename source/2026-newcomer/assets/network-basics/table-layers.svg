<rect x="0" y="50" width="315" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">应用层</text>
