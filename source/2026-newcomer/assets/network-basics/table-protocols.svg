<svg xmlns="http://www.w3.org/2000/svg" width="900" height="443" viewBox="0 0 900 443">
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0" y="1" width="252" height="49" fill="#eceff2" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="31" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#24292f">协议</text>
<rect x="252" y="1" width="648" height="49" fill="#eceff2" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="31" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#24292f">主要用途</text>
<rect x="0" y="50" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">IP</text>
<rect x="252" y="50" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">负责标识设备地址并在网络之间传递数据</text>
<rect x="0" y="99" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="129" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">TCP</text>
<rect x="252" y="99" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="129" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">提供可靠、有序的数据传输</text>
<rect x="0" y="148" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">UDP</text>
<rect x="252" y="148" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="178" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">以数据报形式快速发送数据，不保证送达和顺序</text>
<rect x="0" y="197" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="227" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">DNS</text>
<rect x="252" y="197" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="227" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">查询域名对应的 IP 地址等信息</text>
<rect x="0" y="246" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="276" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">HTTP</text>
<rect x="252" y="246" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="276" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">在客户端和服务器之间传输 Web 资源和接口数据</text>
<rect x="0" y="295" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="325" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">HTTPS</text>
<rect x="252" y="295" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="325" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">在 TLS 保护下使用 HTTP</text>
<rect x="0" y="344" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="374" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">SSH</text>
<rect x="252" y="344" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="374" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">安全地远程登录和操作服务器</text>
<rect x="0" y="393" width="252" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="12" y="423" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">Git</text>
<rect x="252" y="393" width="648" height="49" fill="#ffffff" stroke="#d5d9df" stroke-width="1"/>
<text x="264" y="423" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24292f">管理版本历史，远程传输通常会借助 HTTPS 或 SSH</text>
</svg>